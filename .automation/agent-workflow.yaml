## VALIDATION GATE DEFINITIONS

gates:
  code_quality:
    name: "Code Quality"
    checks:
      - "typescript_strict_mode"
      - "eslint_passing"
      - "prettier_formatted"
      - "no_security_issues"
    auto_pass_threshold: "100%"
    failure_action: "BLOCK_MERGE"
    owner: "ECLIPSE"

  test_coverage:
    name: "Test Coverage"
    checks:
      - "line_coverage > 90%"
      - "branch_coverage > 85%"
      - "all_tests_passing"
      - "no_skipped_tests"
    auto_pass_threshold: "100%"
    failure_action: "BLOCK_MERGE"
    owner: "ECLIPSE"

  performance:
    name: "Performance"
    checks:
      - "no_regression"
      - "benchmark_passing"
      - "memory_acceptable"
      - "latency_ok"
    auto_pass_threshold: "100%"
    failure_action: "WARN_AND_MERGE"
    owner: "VELOCITY"

  documentation:
    name: "Documentation"
    checks:
      - "api_docs_complete"
      - "readme_updated"
      - "examples_present"
      - "changelog_updated"
    auto_pass_threshold: "100%"
    failure_action: "WARN_AND_MERGE"
    owner: "MENTOR"

  integration:
    name: "Integration"
    checks:
      - "builds_successfully"
      - "no_typescript_errors"
      - "imports_resolve"
      - "dependencies_ok"
      - "no_circular_deps"
    auto_pass_threshold: "100%"
    failure_action: "BLOCK_MERGE"
    owner: "APEX"

---

## DAILY EXECUTION LOOP

daily_standup:
  schedule: "async (posted in GitHub Issues)"
  format: "markdown"
  required_sections:
    - progress: "% complete, LOC committed, tests passing"
    - blockers: "any issues preventing progress"
    - metrics: "coverage, performance, hours spent"
    - next_day: "planned tasks for tomorrow"
  template: |
    ## Daily Standup - Phase N - [AGENT]

    **Date:** 2026-02-XX
    **Agent:** @AGENT_NAME
    **Phase:** Phase N - [Title]
    **Effort Spent:** X hours

    ### Progress
    - [ ] Task A: XX% (YY/ZZ done)
    - [ ] Task B: XX% (YY/ZZ done)

    **Metrics:**
    - Lines of code: XXX
    - Tests passing: XX/XX
    - Coverage: XX%

    ### Blockers
    None / [List any blockers]

    ### Next Steps
    1. Complete Task A
    2. Begin Task B
    3. Validate gates

---

## AGENT DECISION AUTHORITY MATRIX

decision_authority:
  code_commit:
    agent_can_decide: true
    threshold: "all gates passing"
    escalation_if: "any gate failing"

  test_failure_investigation:
    agent_can_decide: true
    threshold: "root cause identified"
    escalation_if: "unfamiliar domain"

  deadline_slip:
    agent_can_decide: true
    threshold: "slip < 12 hours"
    escalation_if: "slip > 24 hours"
    escalation_to: "@OMNISCIENT"
    escalation_if_critical: "slip > 48 hours → USER"

  scope_change:
    agent_can_decide: false
    escalation_to: "@OMNISCIENT"
    escalation_if_critical: "major feature → USER"

  architectural_decision:
    agent_can_decide: true
    threshold: "within phase scope"
    escalation_if: "affects other phases"
    escalation_to: "@OMNISCIENT"

  technical_debt:
    agent_can_decide: true
    threshold: "doesn't block progress"
    escalation_if: "blocks delivery"
    escalation_to: "@OMNISCIENT"

---

## FAILURE RECOVERY PROCEDURES

failure_modes:

  test_regression:
    detection: "test count decreased OR coverage dropped"
    response:
      - "immediately rollback last commit"
      - "post issue in GitHub"
      - "investigate root cause"
      - "fix and recommit"
    escalation_if: "cannot determine cause in 1 hour"
    escalation_to: "@OMNISCIENT"

  deadline_slip:
    detection: "projected completion > target date"
    response:
      - "if slip < 6h: continue, no action"
      - "if slip 6-12h: daily check-ins"
      - "if slip 12-24h: escalate to @OMNISCIENT"
      - "if slip > 24h: escalate to USER"
    recovery_tactics:
      - "identify critical path items"
      - "defer non-critical tasks"
      - "increase parallelization"

  dependency_blocked:
    detection: "upstream phase incomplete"
    response:
      - "check PHASE_COMPLETION.md for status"
      - "message upstream agent with timeline"
      - "prepare integration tests meanwhile"
      - "if wait > 6h: escalate to @OMNISCIENT"
    recovery_tactics:
      - "mock upstream dependencies"
      - "develop in isolation"
      - "prepare integration branch"

  performance_regression:
    detection: "benchmark time increased > 5%"
    response:
      - "investigate performance profiler output"
      - "identify regression commit"
      - "optimize or revert"
      - "re-run benchmark"
    escalation_if: "cannot identify cause in 2 hours"
    escalation_to: "@VELOCITY"

  integration_failure:
    detection: "code works in isolation but fails in integration"
    response:
      - "isolate failing integration point"
      - "add integration tests"
      - "fix integration issue"
      - "update interface documentation"
    escalation_if: "affects multiple components"
    escalation_to: "@ARCHITECT"

---

## MEMORY & LEARNING

memory:
  enabled: true
  type: "MNEMONIC (Multi-Agent Neural Experience Memory)"

  experience_storage:
    - decision_outcomes: "track what worked and what didn't"
    - failure_modes: "learn from integration issues"
    - performance_patterns: "identify optimization opportunities"
    - estimation_accuracy: "improve future effort estimates"

  learning_triggers:
    - "phase completion → save experience"
    - "failure recovery → save solution"
    - "performance optimization → save technique"
    - "daily standup → update metrics"

  cross_agent_sharing:
    enabled: true
    tier_share: true
    breakthrough_promotion: true
    fitness_evolution: true

---

## ESCALATION PATHS

escalation_levels:

  level_1_agent_autonomous:
    authority: ["code commits", "test investigation", "minor deadline slips < 12h"]
    cannot_escalate: false
    must_inform: "@OMNISCIENT (async)"

  level_2_omniscient:
    authority: ["deadline slips 12-48h", "scope questions", "architectural decisions"]
    must_decide_by: "same day"
    escalates_to: "USER (if > 48h slip)"

  level_3_user:
    authority: ["deadline slips > 48h", "major scope changes", "feature cuts"]
    decision_window: "4 hours"

  critical_issue:
    definition: "project stopped, wait time > 6 hours"
    action: "immediate escalation to USER"
    parallel: "all agents assist diagnosis"

---

## METRICS COLLECTION

metrics:
  phase_metrics:
    - hours_spent: "sum of agent effort"
    - lines_of_code: "LOC committed per phase"
    - test_count: "number of passing tests"
    - coverage: "line and branch coverage %"
    - performance: "benchmark results (ms/op)"
    - gate_status: "pass/fail for each validation gate"

  collection_frequency:
    - push: "automatic on every commit"
    - daily: "agent standup captures daily metrics"
    - weekly: "generate trend report"
    - phase_complete: "auto-generate phase summary"

  dashboard:
    type: "real-time metrics dashboard"
    location: ".automation/metrics-dashboard.json"
    updates_frequency: "every commit"
    displays:
      - "phase progress %"
      - "effort remaining (hours)"
      - "deadline tracking (days)"
      - "test trends"
      - "coverage trends"
      - "performance trends"

---

## WEEKLY SYNCHRONIZATION

weekly_sync:
  schedule: "every Friday 2pm UTC"
  duration: "30 minutes"
  format: "text-based async standups (no meetings if not required)"

  agenda:
    - progress_update: "all phases, blockers, risks"
    - metric_review: "coverage, performance, schedule"
    - dependency_check: "upcoming critical paths"
    - risk_assessment: "new risks identified"
    - adjustment_planning: "if slip detected, adjust timeline"

  required_attendees: "all primary agents (APEX, ECLIPSE, SENTRY, MENTOR, VELOCITY, OMNISCIENT)"

  output:
    - weekly_report: "markdown document"
    - updated_phase_completion: "dashboard update"
    - risk_register: "updated with new risks"

