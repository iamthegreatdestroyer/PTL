## DEFINITION OF DONE

phase_complete_criteria:
  - all_code_merged: true
  - all_gates_passing: true
  - coverage_target_met: true
  - performance_target_met: true
  - documentation_complete: true
  - no_known_bugs: true
  - tests_passing: true
  - zero_typescript_errors: true

  auto_transition:
    to_next_phase: "when all_criteria_met"
    notification: "auto-posted GitHub issue"
    deployment: "auto-merge to main"

