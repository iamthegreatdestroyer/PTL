<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="ptl-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#007acc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background hexagon -->
    <path d="M64 8 L112 36 V92 L64 120 L16 92 V36 Z" fill="none" stroke="url(#ptl-gradient)" stroke-width="4" />

    <!-- Inner lattice structure -->
    <circle cx="64" cy="32" r="6" fill="#007acc"/>
    <circle cx="40" cy="56" r="5" fill="#22c55e"/>
    <circle cx="88" cy="56" r="5" fill="#22c55e"/>
    <circle cx="64" cy="80" r="5" fill="#eab308"/>
    <circle cx="40" cy="96" r="4" fill="#ef4444"/>
    <circle cx="88" cy="96" r="4" fill="#ef4444"/>

    <!-- Connecting lines -->
    <line x1="64" y1="32" x2="40" y2="56" stroke="#3e3e42" stroke-width="2"/>
    <line x1="64" y1="32" x2="88" y2="56" stroke="#3e3e42" stroke-width="2"/>
    <line x1="40" y1="56" x2="64" y2="80" stroke="#3e3e42" stroke-width="2"/>
    <line x1="88" y1="56" x2="64" y2="80" stroke="#3e3e42" stroke-width="2"/>
    <line x1="40" y1="56" x2="40" y2="96" stroke="#3e3e42" stroke-width="2"/>
    <line x1="88" y1="56" x2="88" y2="96" stroke="#3e3e42" stroke-width="2"/>
    <line x1="64" y1="80" x2="40" y2="96" stroke="#3e3e42" stroke-width="2"/>
    <line x1="64" y1="80" x2="88" y2="96" stroke="#3e3e42" stroke-width="2"/>
</svg>
