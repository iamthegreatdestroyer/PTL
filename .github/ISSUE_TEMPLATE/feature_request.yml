name: Feature Request
description: Suggest a new feature or enhancement for PTL
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees:
  - iamthegreatdestroyer

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We love hearing ideas from the community.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a pain point?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which PTL component would this feature affect?
      options:
        - "@ptl/core - Inference engine"
        - "@ptl/cli - Command line tool"
        - "@ptl/vscode - VS Code extension"
        - "@ptl/web - Web dashboard"
        - "@ptl/runtime-observer - Runtime observation"
        - "@ptl/type-priors - Prior database"
        - "@ptl/lattice-visualizer - Visualization"
        - "New component"
        - "Multiple components"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact Level
      description: How important is this feature to your workflow?
      options:
        - "Critical - Blocking my use of PTL"
        - "High - Significant improvement"
        - "Medium - Nice to have"
        - "Low - Minor improvement"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples
