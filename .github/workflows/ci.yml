# ===============================
# PTL - Continuous Integration
# ===============================
name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
    # =============================
    # Build and Test Matrix
    # =============================
    build-and-test:
        name: Build & Test (Node ${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: [20, 22]

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8

            - name: 🟢 Setup Node.js ${{ matrix.node }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: "pnpm"

            - name: 📥 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗️ Build
              run: pnpm build

            - name: 🧪 Test
              run: pnpm test

    # =============================
    # Lint and Type Check
    # =============================
    lint:
        name: Lint & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: 📥 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 📝 Lint
              run: pnpm lint

            - name: 🔍 Type check
              run: pnpm typecheck

            - name: 🎨 Check formatting
              run: pnpm format:check

    # =============================
    # Code Coverage
    # =============================
    coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        needs: build-and-test

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: 📥 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 📊 Run tests with coverage
              run: pnpm test:coverage

            - name: � Check coverage thresholds
              run: |
                  # Extract overall coverage from Vitest output
                  echo "Coverage thresholds enforced via Vitest config"
                  echo "Minimum requirements: 80% lines, 80% functions, 70% branches"

            - name: �📤 Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./packages/*/coverage/lcov.info,./apps/*/coverage/lcov.info
                  fail_ci_if_error: false
                  verbose: true

    # =============================
    # VS Code Extension
    # =============================
    vscode-extension:
        name: VS Code Extension
        runs-on: ubuntu-latest
        needs: build-and-test

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: 8

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: 📥 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗️ Build extension dependencies
              run: pnpm build --filter=@ptl/vscode^...

            - name: 📦 Package VS Code extension
              run: pnpm --filter=@ptl/vscode package

            - name: 📤 Upload extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ptl-vscode-extension
                  path: apps/vscode/*.vsix
                  if-no-files-found: warn
